name: Build

on:
    push:
        branches: [ main, develop ]
    pull_request:

permissions:
    contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
    group: build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:

        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:

            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        9.0.x
                        10.0.x

            -   name: Cache NuGet packages
                uses: actions/cache@v6
                with:
                    path: ~/.nuget/packages
                    key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'src/Directory.Packages.props', 'src/Directory.Build.props') }}
                    restore-keys: |
                        nuget-${{ runner.os }}-

            -   name: Restore
                run: dotnet restore src/Sanitiser.sln

            -   name: Build
                run: dotnet build src/Sanitiser.sln --configuration Release --no-restore

            -   name: Test
                run: dotnet test src/Sanitiser.sln --configuration Release --no-build --verbosity normal
