name: Build

on:
    push:
        branches: [ main, develop ]
    pull_request:

jobs:
    build:

        runs-on: ubuntu-latest

        steps:

            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        9.0.x
                        10.0.x

            -   name: Restore
                run: dotnet restore src/Sanitiser.sln

            -   name: Build
                run: dotnet build src/Sanitiser.sln --configuration Release --no-restore

            -   name: Test
                run: dotnet test src/Sanitiser.sln --configuration Release --no-build --verbosity normal
